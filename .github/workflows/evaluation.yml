name: Retrieval evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "eval/**"
      - "sample_data/**"
      - "scripts/evaluate_retrieval.py"
      - "requirements.txt"
      - ".github/workflows/evaluation.yml"

jobs:
  evaluate:
    name: Evaluate retrieval
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache embedding models
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('scripts/evaluate_retrieval.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation
        run: |
          python scripts/evaluate_retrieval.py --output eval/results.md --fail-under 0.9
          cat eval/results.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: retrieval-evaluation
          path: eval/results.md

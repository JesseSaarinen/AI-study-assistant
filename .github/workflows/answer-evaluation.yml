name: Answer evaluation

# Calls a real chat API, so it only runs on demand: from the Actions tab, or by
# adding the "evaluate-answers" label to a pull request. Needs an
# OPENAI_API_KEY repository secret, for example a free Gemini key.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Chat model, also used as the judge unless a judge model is set
        default: gemini-3.5-flash-lite
      judge_model:
        description: Judge model (optional)
        default: ""
      base_url:
        description: OpenAI-compatible endpoint
        default: https://generativelanguage.googleapis.com/v1beta/openai/
      requests_per_minute:
        description: Request limit, to stay within free tier quotas
        default: "10"
  pull_request:
    types: [labeled]

jobs:
  evaluate:
    name: Evaluate answers
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'evaluate-answers'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ inputs.base_url || vars.OPENAI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
      OPENAI_MODEL: ${{ inputs.model || vars.OPENAI_MODEL || 'gemini-3.5-flash-lite' }}
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - name: Check for an API key
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "::error::Add an OPENAI_API_KEY repository secret to run the answer evaluation."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache embedding models
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-answers-${{ hashFiles('src/config.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation
        env:
          JUDGE_MODEL: ${{ inputs.judge_model }}
          REQUESTS_PER_MINUTE: ${{ inputs.requests_per_minute || '10' }}
        run: |
          args=(--requests-per-minute "$REQUESTS_PER_MINUTE")
          if [ -n "$JUDGE_MODEL" ]; then
            args+=(--judge-model "$JUDGE_MODEL")
          fi
          python scripts/evaluate_answers.py "${args[@]}"
          cat eval/answer_results.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: answer-evaluation
          path: eval/answer_results.md
          if-no-files-found: ignore

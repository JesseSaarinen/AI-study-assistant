name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov --cov-report=term-missing

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag ai-study-assistant:ci .

      - name: Check the embedding model works offline
        run: |
          docker run --rm --network none ai-study-assistant:ci python -c \
            "from src.embeddings import load_embedding_model; \
            print(len(load_embedding_model('all-MiniLM-L6-v2').encode(['test'])[0]))"

      - name: Check the app starts
        run: |
          docker run --detach --name app --publish 8501:8501 ai-study-assistant:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
